<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A friendly welcome page for your website.">
  <title>Welcome</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #172554;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 70px rgba(30, 41, 59, 0.14);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      color: #4f46e5;
      background: #eef2ff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.1;
    }

    p {
      max-width: 480px;
      margin: 20px auto 30px;
      color: #64748b;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 10px;
      color: #fff;
      background: #4f46e5;
      font-weight: 700;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    a:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 3px solid #a5b4fc;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">A place to begin</span>
    <h1>Welcome to our website!</h1>
    <p>
      We’re glad you’re here. Explore, discover something new, and enjoy your
      visit.
    </p>
    <a href="#welcome">Get started</a>
  </main>
</body>
</html>
